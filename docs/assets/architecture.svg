<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Advanced Language Agent architecture</title>
  <desc id="desc">A caller sends a request to the ALA runtime. ALA reads mounted skills and folders, then routes work either to direct model execution or to a sandboxed native coding agent.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#315e89"/></marker><style>.core{fill:#edf5fb;stroke:#315e89;stroke-width:2.2}.route{fill:#f7f1df;stroke:#8a6a24;stroke-width:2.2}.external{fill:#f0f7ef;stroke:#3e7448;stroke-width:2}.label{font:600 19px system-ui,sans-serif;fill:#17324d}.text{font:15px system-ui,sans-serif;fill:#263b4d}.small{font:13px system-ui,sans-serif;fill:#526273}.arrow{fill:none;stroke:#315e89;stroke-width:2.4;marker-end:url(#arrow)}.dash{fill:none;stroke:#65798a;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#arrow)}</style></defs>
  <rect class="external" x="40" y="250" width="190" height="120" rx="14"/><text class="label" x="135" y="288" text-anchor="middle">Caller</text><text class="text" x="135" y="320" text-anchor="middle">CLI or calling process</text><text class="small" x="135" y="347" text-anchor="middle">Prompt in · result out</text>
  <rect class="external" x="330" y="45" width="550" height="115" rx="14"/><text class="label" x="605" y="82" text-anchor="middle">Mounted inputs</text><text class="text" x="605" y="114" text-anchor="middle">Task skills and explicitly authorized folders</text><text class="small" x="605" y="140" text-anchor="middle">Current process inputs; read-only by default</text>
  <rect class="route" x="330" y="220" width="550" height="200" rx="16"/><text class="label" x="605" y="260" text-anchor="middle">ALA runtime</text><text class="text" x="605" y="296" text-anchor="middle">Load the request and current configuration</text><text class="text" x="605" y="326" text-anchor="middle">Route execution through MainAgent</text><text class="text" x="605" y="356" text-anchor="middle">Normalize output and own the runtime lifecycle</text><text class="small" x="605" y="390" text-anchor="middle">One-shot or interactive process boundary</text>
  <rect class="external" x="970" y="70" width="190" height="125" rx="14"/><text class="label" x="1065" y="108" text-anchor="middle">Direct model</text><text class="text" x="1065" y="140" text-anchor="middle">LLMAgent execution</text><text class="small" x="1065" y="168" text-anchor="middle">No coding workspace</text>
  <rect class="core" x="970" y="270" width="190" height="165" rx="14"/><text class="label" x="1065" y="308" text-anchor="middle">Coding-agent sandbox</text><text class="text" x="1065" y="340" text-anchor="middle">Temporary workspace</text><text class="small" x="1065" y="368" text-anchor="middle">Bubblewrap isolation</text><text class="small" x="1065" y="392" text-anchor="middle">Skills and folders mounted</text><text class="small" x="1065" y="416" text-anchor="middle">for this runtime</text>
  <rect class="external" x="970" y="520" width="190" height="115" rx="14"/><text class="label" x="1065" y="558" text-anchor="middle">Native agents</text><text class="text" x="1065" y="590" text-anchor="middle">Codex · OpenCode · Pi</text><text class="small" x="1065" y="616" text-anchor="middle">Installed backends</text>
  <path class="arrow" d="M230 310 H330"/><text class="small" x="280" y="298" text-anchor="middle">request / result</text>
  <path class="dash" d="M605 160 V220"/>
  <path class="arrow" d="M880 270 H925 V132 H970"/><text class="small" x="914" y="220" text-anchor="middle">direct route</text>
  <path class="arrow" d="M880 350 H970"/><text class="small" x="925" y="338" text-anchor="middle">coding route</text>
  <path class="arrow" d="M1065 435 V520"/>
</svg>
